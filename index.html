<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oemah Checklist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
       :root {
        --sage: #9caf88;
        --olive: #708238;
        --terracotta: #cc7e5c;
        --background: #ffffff; /* Ganti cream jadi putih */
        --note-perpulangan: #f1f8e9; /* Mint Muda */
        --note-kiriman: #fffde7;    /* Kuning Lemon Pucat */
        --note-kunjungan: #fce4ec;  /* Pink Soft */
        --note-oper: #e3f2fd;       /* Biru Air */
        --note-pinjam: #f3e5f5;     /* Lavender */
    }

    body {
        margin: 0;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--background); /* Pakai variabel putih tadi */
        background-image: radial-gradient(#e5e5e5 0.5px, transparent 0.5px); /* Titik-titik minimalis */
        background-size: 20px 20px;
        color: #344e41;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow-x: hidden;
        padding-top: 150px;
        padding-bottom: 150px;
    }

        /* --- DEKORASI TANAMAN POT BAWAH (FULL) --- */
        .bottom-garden {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            background: rgba(156, 175, 136, 0.15);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 1001;
            pointer-events: none;
            border-top: 1px dashed var(--sage);
        }

        .pot-row {
            display: flex;
            gap: 10px;
            font-size: 50px;
            padding-bottom: 10px;
            white-space: nowrap;
            animation: sway 5s ease-in-out infinite alternate;
        }

        @keyframes sway {
            from { transform: translateX(-5px); }
            to { transform: translateX(5px); }
        }

        /* --- MENU BAR ATAS --- */
        .tab-nav {
            position: fixed;
            top: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            display: flex;
            padding: 8px;
            gap: 12px;
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            z-index: 2000;
        }

        .tab-item {
            position: relative;
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 22px;
        }

        .tab-item.active { background: var(--sage); color: white; transform: scale(1.1); }

        .tab-item .tooltip {
            visibility: hidden; opacity: 0;
            background: #4a5d4a; color: white;
            padding: 5px 12px; border-radius: 8px;
            position: absolute; bottom: -45px;
            font-size: 11px; transition: 0.3s;
            font-weight: 600;
        }

        .tab-item:hover .tooltip { visibility: visible; opacity: 1; }

        /* --- TOMBOL ADD --- */
        .add-btn {
            position: fixed;
            top: 90px;
            background: var(--terracotta);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(204, 126, 92, 0.4);
            z-index: 1500;
            cursor: pointer;
            font-family: 'Quicksand';
        }

        /* --- STICKY NOTE --- */
        .sticky-note {
            width: 85%;
            max-width: 480px;
            min-height: 400px;
            padding: 50px 30px;
            border-radius: 2px;
            box-shadow: 20px 20px 40px rgba(0,0,0,0.05);
            position: relative;
            transition: 0.5s ease;
            z-index: 5;
            background-image: repeating-linear-gradient(transparent, transparent 31px, rgba(0,0,0,0.05) 31px, rgba(0,0,0,0.05) 32px);
        }

        .sticky-note::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-1deg);
            width: 150px; height: 45px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(3px);
            border: 1px solid rgba(255,255,255,0.4);
        }

        .page { display: none; }
        .page.active { display: block; }

        .item-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .del-btn { background: none; border: none; cursor: pointer; opacity: 0.3; }

        /* --- WATERMARK --- */
        .watermark {
            margin-top: 50px;
            font-size: 11px;
            opacity: 0.5;
            letter-spacing: 2px;
            text-align: center;
            font-family: 'Quicksand';
        }

        /* --- MODAL --- */
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            z-index: 3000; justify-content: center; align-items: center;
        }
        .modal-content { background: white; padding: 30px; border-radius: 30px; width: 85%; max-width: 320px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: 1px solid #eee; box-sizing: border-box; }
    </style>
</head>
<body>

    <div class="bottom-garden">
        <div class="pot-row">
            🪴 🌵 🌿 🍃 🪴 🌵 🌿 🍃 🪴
        </div>
    </div>

    <div class="tab-nav">
        <div class="tab-item active" onclick="showPage('perpulangan', this, 'var(--note-perpulangan)')">
            🏠 <span class="tooltip">Perpulangan</span>
        </div>
        <div class="tab-item" onclick="showPage('kiriman', this, 'var(--note-kiriman)')">
            📦 <span class="tooltip">Kiriman</span>
        </div>
        <div class="tab-item" onclick="showPage('kunjungan', this, 'var(--note-kunjungan)')">
            ✨ <span class="tooltip">Kunjungan</span>
        </div>
        <div class="tab-item" onclick="showPage('oper', this, 'var(--note-oper)')">
            🔃 <span class="tooltip">Oper Balik</span>
        </div>
        <div class="tab-item" onclick="showPage('pinjam', this, 'var(--note-pinjam)')">
            🤝 <span class="tooltip">Pinjaman</span>
        </div>
    </div>

    <button class="add-btn" onclick="openModal()">+ Tambah Barang</button>

    <div class="sticky-note" id="mainNote" style="background-color: var(--note-perpulangan);">
        <div id="perpulangan" class="page active"><h3>List Perpulangan</h3><div id="list-perpulangan"></div></div>
        <div id="kiriman" class="page"><h3>Kiriman Minggu</h3><div id="list-kiriman"></div></div>
        <div id="kunjungan" class="page"><h3>Kunjungan Bulanan</h3><div id="list-kunjungan"></div></div>
        <div id="oper" class="page"><h3>Oper Balik</h3><div id="list-oper"></div></div>
        <div id="pinjam" class="page">
            <h3>Pinjaman</h3>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div><h4 style="font-size:10px; color:var(--olive)">AKU PINJAM</h4><div id="list-aku-pinjam"></div></div>
                <div><h4 style="font-size:10px; color:var(--olive)">DIPINJAM</h4><div id="list-dipinjam"></div></div>
            </div>
        </div>
        <div class="watermark">Oemah Checklist by N4T3V_</div>
    </div>

    <div id="inputModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-family:'Quicksand'">Baru</h3>
            <input type="text" id="itemName" placeholder="Ketik barang...">
            <select id="targetTab">
                <option value="perpulangan">🏠 Perpulangan</option>
                <option value="kiriman">📦 Kiriman</option>
                <option value="kunjungan">✨ Kunjungan</option>
                <option value="oper">🔃 Oper Balik</option>
                <option value="aku-pinjam">🤝 Aku Pinjam</option>
                <option value="dipinjam">👤 Dipinjam</option>
            </select>
            <button onclick="addItem()" style="width:100%; background:var(--sage); color:white; border:none; padding:12px; border-radius:15px; cursor:pointer;">Simpan</button>
            <button onclick="closeModal()" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer;">Batal</button>
        </div>
    </div>

    <script>
        function showPage(pageId, el, color) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById('mainNote').style.backgroundColor = color;
            el.classList.add('active');
        }

        function openModal() { document.getElementById('inputModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('inputModal').style.display = 'none'; }

        function addItem() {
            const name = document.getElementById('itemName').value;
            const tab = document.getElementById('targetTab').value;
            if(!name) return;

            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<input type="checkbox"> <span style="flex-grow:1; margin:0 10px;">${name}</span> <button class="del-btn" onclick="this.parentElement.remove()">✖</button>`;

            document.getElementById('list-' + tab).appendChild(div);
            document.getElementById('itemName').value = '';
            closeModal();
        }

        setInterval(() => {
            const now = new Date();
            if (now.getDay() === 6 && now.getHours() === 9 && now.getMinutes() === 20) {
                alert("⏰ Oemah Checklist: Waktunya cek barang!");
            }
        }, 60000);
    </script>
</body>
</html>
