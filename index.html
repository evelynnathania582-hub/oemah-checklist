<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oemah Checklist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sage: #9caf88;
            --olive: #708238;
            --terracotta: #cc7e5c;
            --cream: #f9f7f2;
            --glass: rgba(255, 255, 255, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png'); /* Efek grainy paper */
            color: #4a5d4a;
            overflow-x: hidden;
        }

        /* Tombol Terracotta Melayang di Tengah Atas */
        .add-btn {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--terracotta);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(204, 126, 92, 0.4);
            z-index: 100;
            cursor: pointer;
            transition: 0.3s;
        }

        .add-btn:active { transform: translateX(-50%) scale(0.95); }

        /* Navigasi Tab Atas */
        .tab-nav {
            position: sticky;
            top: 0;
            background: var(--glass);
            backdrop-filter: blur(10px);
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            padding: 15px 10px;
            gap: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            z-index: 99;
            scrollbar-width: none; /* Hilangkan scrollbar di Firefox */
        }

        .tab-nav::-webkit-scrollbar { display: none; } /* Hilangkan scrollbar di Chrome */

        .tab-item {
            padding: 8px 18px;
            border-radius: 20px;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            color: var(--sage);
        }

        .tab-item.active {
            background: var(--sage);
            color: white;
        }

        /* Container Isi Kartu */
        .content-container {
            padding: 100px 20px 20px 20px; /* Jarak agar tidak tertutup tombol */
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Kartu Estetik (Glassmorphism) */
        .card {
            background: var(--glass);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.6);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .card h3 { margin: 0 0 10px 0; font-family: 'Quicksand', sans-serif; font-size: 18px; }

        /* Watermark */
        .watermark {
            text-align: center;
            font-size: 12px;
            opacity: 0.5;
            margin: 40px 0 20px 0;
            font-style: italic;
        }
    </style>
</head>
<body>

    <button class="add-btn">+ Tambah Barang</button>

    <div class="tab-nav">
        <div class="tab-item active">🏠 Perpulangan</div>
        <div class="tab-item">📦 Kiriman</div>
        <div class="tab-item">✨ Kunjungan</div>
        <div class="tab-item">🔃 Oper Balik</div>
        <div class="tab-item">🤝 Pinjaman</div>
    </div>

    <div class="content-container">
        <div class="card">
            <h3>Selamat Datang di Oemah Checklist 🌿</h3>
            <p>Klik tab di atas untuk mulai mencatat barang bawaanmu.</p>
        </div>
        
        <div class="card">
            <input type="checkbox"> Sabun Mandi (Habis)
        </div>
    </div>

    <div class="watermark">by N4T3V_</div>

    <script>
        // Logika simpel untuk pindah tab (Visual saja dulu)
        const tabs = document.querySelectorAll('.tab-item');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });
    </script>

</body>
</html>
