<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oemah Checklist</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --sage: #9caf88;
            --terracotta: #cc7e5c;
            --cream: #f9f7f2;
            /* Warna Sticky Notes */
            --note-perpulangan: #e8f3e8; /* Soft Green */
            --note-kiriman: #fff9e6;      /* Butter Yellow */
            --note-kunjungan: #ffece6;    /* Peach */
            --note-oper: #e6f2ff;         /* Sky Blue */
            --note-pinjam: #f2e6ff;       /* Lavender */
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--cream);
            background-image: url('https://www.transparenttextures.com/patterns/p6.png');
            color: #4a5d4a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-top: 130px;
        }

        /* Dekorasi Tanaman Aesthetic */
        .plant-left {
            position: fixed;
            bottom: -20px;
            left: -20px;
            width: 150px;
            pointer-events: none;
            z-index: 10;
            opacity: 0.8;
        }

        .plant-right {
            position: fixed;
            top: -10px;
            right: -20px;
            width: 120px;
            transform: rotate(180deg);
            pointer-events: none;
            z-index: 10;
            opacity: 0.7;
        }

        /* Navigasi Tab Minimalis */
        .tab-nav {
            position: fixed;
            top: 15px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(15px);
            display: flex;
            padding: 8px;
            gap: 10px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            z-index: 1000;
        }

        .tab-item {
            position: relative;
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.4s;
            font-size: 20px;
        }

        .tab-item.active { background: var(--sage); color: white; }

        .tab-item .tooltip {
            visibility: hidden; opacity: 0;
            background: #4a5d4a; color: white;
            padding: 5px 12px; border-radius: 8px;
            position: absolute; bottom: -45px;
            font-size: 10px; transition: 0.3s;
        }
        .tab-item:hover .tooltip { visibility: visible; opacity: 1; }

        /* Tombol Terracotta Melayang */
        .add-btn {
            position: fixed;
            top: 85px;
            background: var(--terracotta);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px 50px 20px 50px; /* Bentuk Organic */
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(204, 126, 92, 0.3);
            z-index: 999;
            cursor: pointer;
            font-family: 'Quicksand';
            transition: 0.3s;
        }

        /* Sticky Note Utama */
        .sticky-note {
            width: 90%;
            max-width: 450px;
            min-height: 400px;
            padding: 40px 30px;
            border-radius: 5px;
            box-shadow: 10px 10px 20px rgba(0,0,0,0.05);
            position: relative;
            transition: background-color 0.5s ease;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 20px 20px; /* Titik-titik grid */
        }

        /* Efek Selotip (Washi Tape) */
        .sticky-note::before {
            content: "";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 120px;
            height: 35px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.3);
        }

        .page { display: none; }
        .page.active { display: block; }

        .item-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
        }

        .item-text { flex-grow: 1; margin: 0 10px; font-weight: 400; font-size: 16px; }

        .del-btn { background: none; border: none; cursor: pointer; font-size: 14px; opacity: 0.3; }
        .del-btn:hover { opacity: 1; color: var(--terracotta); }

        /* Pop-up Modal */
        .modal {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(5px);
            z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 20px;
            width: 80%; max-width: 320px;
        }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #eee; box-sizing: border-box; }

        /* Pinjaman Grid */
        .pinjam-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .pinjam-col h4 { font-size: 12px; margin-top: 0; color: var(--olive); border-bottom: 1px solid var(--sage); }

        /* Watermark */
        .watermark {
            margin-top: 40px;
            font-size: 11px;
            opacity: 0.5;
            letter-spacing: 1px;
            font-family: 'Quicksand';
            padding-bottom: 30px;
        }
    </style>
</head>
<body>

    <svg class="plant-left" viewBox="0 0 100 100" fill="var(--sage)"><path d="M10,90 Q30,40 80,20 Q60,60 10,90" /></svg>
    <svg class="plant-right" viewBox="0 0 100 100" fill="var(--sage)"><path d="M10,90 Q30,40 80,20 Q60,60 10,90" /></svg>

    <div class="tab-nav">
        <div class="tab-item active" onclick="showPage('perpulangan', this, 'var(--note-perpulangan)')">🏠<span class="tooltip">Perpulangan</span></div>
        <div class="tab-item" onclick="showPage('kiriman', this, 'var(--note-kiriman)')">📦<span class="tooltip">Kiriman</span></div>
        <div class="tab-item" onclick="showPage('kunjungan', this, 'var(--note-kunjungan)')">✨<span class="tooltip">Kunjungan</span></div>
        <div class="tab-item" onclick="showPage('oper', this, 'var(--note-oper)')">🔃<span class="tooltip">Oper Balik</span></div>
        <div class="tab-item" onclick="showPage('pinjam', this, 'var(--note-pinjam)')">🤝<span class="tooltip">Pinjaman</span></div>
    </div>

    <button class="add-btn" onclick="openModal()">+ Barang Baru</button>

    <div class="sticky-note" id="mainNote" style="background-color: var(--note-perpulangan);">
        <div id="perpulangan" class="page active"><h3 style="font-family:'Quicksand'">List Perpulangan</h3><div id="list-perpulangan"></div></div>
        <div id="kiriman" class="page"><h3 style="font-family:'Quicksand'">Kiriman Minggu</h3><div id="list-kiriman"></div></div>
        <div id="kunjungan" class="page"><h3 style="font-family:'Quicksand'">Sambangan Bulanan</h3><div id="list-kunjungan"></div></div>
        <div id="oper" class="page"><h3 style="font-family:'Quicksand'">Oper Balik Rumah</h3><div id="list-oper"></div></div>
        <div id="pinjam" class="page">
            <h3 style="font-family:'Quicksand'">Amanah Pinjaman</h3>
            <div class="pinjam-grid">
                <div class="pinjam-col"><h4>Aku Pinjam</h4><div id="list-aku-pinjam"></div></div>
                <div class="pinjam-col"><h4>Dipinjam</h4><div id="list-dipinjam"></div></div>
            </div>
        </div>
    </div>

    <div class="watermark">Oemah Checklist by N4T3V_</div>

    <div id="inputModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0; font-family:'Quicksand'">Tambah Catatan</h3>
            <input type="text" id="itemName" placeholder="Nama barang...">
            <select id="targetTab">
                <option value="perpulangan">🏠 Perpulangan</option>
                <option value="kiriman">📦 Kiriman</option>
                <option value="kunjungan">✨ Kunjungan</option>
                <option value="oper">🔃 Oper Balik</option>
                <option value="aku-pinjam">🤝 Aku Pinjam</option>
                <option value="dipinjam">👤 Dipinjam Teman</option>
            </select>
            <button onclick="addItem()" style="width:100%; background:var(--sage); color:white; border:none; padding:12px; border-radius:10px; cursor:pointer;">Simpan</button>
            <button onclick="closeModal()" style="background:none; border:none; color:gray; width:100%; margin-top:10px; cursor:pointer;">Batal</button>
        </div>
    </div>

    <script>
        function showPage(pageId, el, color) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById('mainNote').style.backgroundColor = color;
            el.classList.add('active');
        }

        function openModal() { document.getElementById('inputModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('inputModal').style.display = 'none'; }

        function addItem() {
            const name = document.getElementById('itemName').value;
            const tab = document.getElementById('targetTab').value;
            if(!name) return;

            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `<input type="checkbox"> <span class="item-text">${name}</span> <button class="del-btn" onclick="this.parentElement.remove()">✖</button>`;

            document.getElementById('list-' + tab).appendChild(div);
            document.getElementById('itemName').value = '';
            closeModal();
        }

        setInterval(() => {
            const now = new Date();
            if (now.getDay() === 6 && now.getHours() === 9 && now.getMinutes() === 20) {
                alert("⏰ Oemah Checklist: Cek list persiapanmu sekarang!");
            }
        }, 60000);
    </script>
</body>
</html>
